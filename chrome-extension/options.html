<!doctype html>
<meta charset="utf-8">
<title>Session Handoff Check — options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 7.5rem; font: inherit; }
  label { display: block; margin: .75rem 0; }
  #status { color: green; margin-left: .5rem; }
</style>
<h1>Session Handoff Check</h1>
<p>Prompt injected into new claude.ai chats:</p>
<textarea id="template"></textarea>
<label><input type="checkbox" id="alwaysOn"> Inject on every new chat (off = only via the toolbar button)</label>
<label><input type="checkbox" id="autoSend"> Auto-send the prompt (off = pre-fill only, you press Enter)</label>
<button id="save">Save</button><span id="status"></span>
<script src="options.js"></script>
