name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify packaging
        run: python3 tests/verify-packaging.py

      - name: Verify Claude auto launcher
        run: python3 tests/test_claude_auto.py

      - name: Verify Codex auto launcher
        run: python3 tests/test_codex_auto.py

      - name: Verify ledger
        run: python3 tests/verify-ledger.py

      - name: Verify deterministic protocol
        run: python3 tests/test_protocol.py

      - name: Verify integrity and cost regressions
        run: python3 tests/test_safety.py

      - name: Verify version bump
        run: python3 tests/test_bump_version.py

      - name: Verify context-watch config
        run: python3 tests/test_context_watch_config.py

      - name: Verify context-watch regressions
        run: python3 tests/test_context_watch_regressions.py

      - name: Verify resume CLI
        run: python3 tests/test_resume_cli.py

      - name: Verify save CLI
        run: python3 tests/test_save_cli.py

      - name: Verify watcher
        run: python3 tests/verify-watcher.py

      - name: Verify skills
        run: python3 tests/verify-skills.py

      - name: Verify trigger corpus
        run: python3 tests/verify-triggers.py

      - name: Verify extension
        run: bash tests/verify-extension.sh
