name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      CONTEXT_WATCH_LOG: "0"
      CONTEXT_WATCH_RESUME_LOG: "0"
      CONTEXT_WATCH_ORIGIN: test
      CONTEXT_WATCH_JEV: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node for extension checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare isolated test state
        shell: bash
        run: |
          handoff_test_home="$(mktemp -d "${RUNNER_TEMP}/handoff-home.XXXXXX")"
          handoff_test_tmp="$(mktemp -d "${RUNNER_TEMP}/handoff-tmp.XXXXXX")"
          {
            echo "HOME=$handoff_test_home"
            echo "USERPROFILE=$handoff_test_home"
            echo "TMPDIR=$handoff_test_tmp"
          } >> "$GITHUB_ENV"

      - name: Check verifier prerequisites
        run: |
          git --version
          node --version

      - name: Run all unittest regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Verify packaging
        run: python3 tests/verify-packaging.py

      - name: Verify ledger
        run: python3 tests/verify-ledger.py

      - name: Verify watcher
        run: python3 tests/verify-watcher.py

      - name: Verify skills
        run: python3 tests/verify-skills.py

      - name: Verify trigger corpus
        run: python3 tests/verify-triggers.py

      - name: Verify extension
        run: bash tests/verify-extension.sh
